<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting to Ollama Operations</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
<!-- The dashboard used to be split across / and /control. It is now one page,
     so this route only exists to keep old bookmarks working. server.py reads
     this file at import and serves it at /control, so it cannot be deleted
     without changing the server. -->
<script>
(function(){
  var map = {overview:'models', activity:'activity', models:'models',
             performance:'bench', system:'host', settings:'host'};
  var raw = location.hash.slice(1);
  location.replace('/#' + (map[raw] || 'models'));
})();
</script>
<meta http-equiv="refresh" content="0; url=/#models">
</head>
<body>
<div style="max-width:52ch;margin:18vh auto;padding:0 24px">
  <h1 style="font-size:21px;font-weight:660;letter-spacing:-.02em">This page moved</h1>
  <p style="margin-top:10px;color:var(--ink-2);font-size:13px;line-height:1.6">
    Monitoring and control are now a single surface. Redirecting you there.
  </p>
  <p style="margin-top:18px"><a class="btn" href="/#models">Open the dashboard</a></p>
</div>
</body>
</html>
