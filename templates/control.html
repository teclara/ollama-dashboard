<!doctype html>
<html><head><meta charset="utf-8"><title>lm studio // control</title>
<style>
  :root{--bg:#0b0d12;--card:#141821;--border:#222936;--text:#e6e9ef;--dim:#7a8290;--accent:#7dd3fc;--accent2:#a78bfa;--good:#86efac;--warn:#fcd34d;--bad:#fca5a5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:24px;max-width:1400px;margin-inline:auto}
  nav{display:flex;gap:16px;margin-bottom:16px;font-size:12px}
  nav a{color:var(--dim);text-decoration:none}
  nav a.active{color:var(--accent2)}
  h1{font-size:14px;font-weight:600;margin:0 0 16px;color:var(--dim);letter-spacing:.05em;text-transform:uppercase}
  h1 span{color:var(--accent2)}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  @media(max-width:900px){.grid-2{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
  .card h2{font-size:11px;font-weight:600;margin:0 0 12px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;color:var(--dim);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--border);text-transform:uppercase;font-size:10px;letter-spacing:.1em}
  td{padding:6px 8px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;vertical-align:middle}
  tr:last-child td{border:0}
  .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px}
  .pill.good{background:rgba(134,239,172,.15);color:var(--good)}
  .pill.warn{background:rgba(252,211,77,.15);color:var(--warn)}
  .pill.bad{background:rgba(252,165,165,.15);color:var(--bad)}
  .pill.dim{background:var(--border);color:var(--dim)}
  button{background:var(--border);color:var(--text);border:1px solid #2d3548;border-radius:4px;padding:4px 10px;font:inherit;font-size:11px;cursor:pointer}
  button:hover{border-color:var(--accent2);color:var(--accent2)}
  button.danger:hover{border-color:var(--bad);color:var(--bad)}
  button.primary{background:var(--accent2);color:#0b0d12;border-color:var(--accent2);font-weight:600}
  button.primary:hover{background:#9061f5;color:#0b0d12}
  button:disabled{opacity:.4;cursor:not-allowed}
  input,select,textarea{background:#0b0d12;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:6px 10px;font:inherit;font-size:12px}
  input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent2)}
  textarea{width:100%;min-height:80px;font-family:ui-monospace,monospace}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row > *{flex-shrink:0}
  .grow{flex:1;min-width:200px}
  .bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:8px 0}
  .bar>div{height:100%;background:var(--accent2);transition:width .3s}
  .empty{color:var(--dim);font-style:italic;padding:12px 0}
  .meta{color:var(--dim);font-size:11px;margin-top:8px}
  pre{background:#0b0d12;border:1px solid var(--border);border-radius:4px;padding:12px;font-size:11px;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
  pre.thinking{color:var(--dim);max-height:200px;overflow-y:auto}
  pre.content{color:var(--text)}
  .stat{display:inline-block;margin-right:16px}
  .stat .k{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.1em}
  .stat .v{font-variant-numeric:tabular-nums;font-weight:600}
  .suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .suggestions button{font-size:10px;padding:3px 8px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:8px}
  .opts label{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .opts input,.opts select{width:100%}
</style></head>
<body>
<nav><a href="/">← dashboard</a><a href="/control" class="active">▸ control</a></nav>
<h1>lm studio // <span>control</span></h1>

<div class="card"><h2 style="display:flex;justify-content:space-between;align-items:center">
    <span>Loaded Models</span>
    <button id="unload-all" class="danger" style="font-size:10px">Unload all</button>
  </h2>
  <div id="loaded"></div>
</div>

<div class="card">
  <h2 style="display:flex;justify-content:space-between;align-items:center">
    <span>Jobs <span id="jobs-summary" style="color:var(--dim);font-weight:400;margin-left:8px">—</span></span>
    <button id="jobs-clear" style="font-size:10px">Clear finished</button>
  </h2>
  <div id="jobs-view"></div>
</div>

<div class="card"><h2>Load Model</h2>
  <div class="row" style="margin-bottom:8px">
    <select id="load-model" class="grow"></select>
    <button id="estimate-btn">Estimate</button>
    <button class="primary" id="load-btn">Load</button>
  </div>
  <div class="opts">
    <label>context<input id="load-ctx" type="number" min="1" placeholder="default"></label>
    <label>gpu offload<select id="load-gpu">
      <option value="">auto</option><option value="max">max</option>
      <option value="off">off</option><option value="0.5">0.5</option>
    </select></label>
    <label>ttl (s)<input id="load-ttl" type="number" min="1" placeholder="none"></label>
    <label>parallel<input id="load-par" type="number" min="1" placeholder="default"></label>
    <label>identifier<input id="load-id" placeholder="default = model key"></label>
  </div>
  <div id="estimate-out"></div>
  <div class="meta">progress shows in the Jobs panel above</div>
</div>

<div class="card"><h2>Test Scenario</h2>
  <div class="row" style="margin-bottom:8px">
    <select id="test-model" class="grow"></select>
    <select id="test-scenario"></select>
    <button class="primary" id="run-test">Run</button>
  </div>
  <textarea id="test-custom" placeholder="custom prompt (used when scenario = custom)" style="display:none"></textarea>
  <div id="test-result" style="margin-top:12px"></div>
</div>

<div class="card"><h2>Local Models</h2><div id="library"></div></div>

<div class="card"><h2>Browse lmstudio.ai/models <span style="color:var(--dim);font-size:10px;font-weight:400;margin-left:8px">cached <span id="cat-age">—</span></span></h2>
  <div class="row" style="margin-bottom:8px">
    <input id="cat-search" class="grow" placeholder="filter by name or size (e.g. 8b, 30b)">
    <button id="cat-refresh">Refresh</button>
  </div>
  <div id="catalog" style="max-height:520px;overflow-y:auto"></div>
</div>

<div class="card"><h2>Download Model</h2>
  <div class="row">
    <input id="dl-name" class="grow" placeholder="e.g. qwen3.5 or qwen/qwen3.5-9b@q8_0 or a Hugging Face URL">
    <button class="primary" id="dl-btn">Download</button>
  </div>
  <div class="meta" style="margin-top:8px">progress shows in the Jobs panel above</div>
</div>

<div class="card"><h2>LM Studio Settings (read-only)</h2><div id="config"></div></div>
<script>
const SCENARIOS = {
  baseline:  "Baseline (3-word reply)",
  reasoning: "Reasoning (bat & ball)",
  coding:    "Coding (is_prime)",
  needle29k: "Needle in 29K context",
  tool_call: "Tool calling (weather)",
  abliter:   "Abliteration probe",
  custom:    "Custom prompt",
};

const el = id => document.getElementById(id);
function ce(tag, opts={}, children=[]){
  const e = document.createElement(tag);
  if(opts.cls) e.className = opts.cls;
  if(opts.text != null) e.textContent = opts.text;
  if(opts.style) e.setAttribute('style', opts.style);
  if(opts.attrs) for(const [k,v] of Object.entries(opts.attrs)) e.setAttribute(k,v);
  for(const c of children){ if(c) e.appendChild(c); }
  return e;
}
function fmtBytes(b){
  if(!b) return '—';
  const u=['B','KB','MB','GB','TB']; let i=0; while(b>=1024 && i<u.length-1){b/=1024;i++;}
  return b.toFixed(1)+' '+u[i];
}
function fmtSecs(s){
  if(s == null) return '—';
  if(s < 60) return Math.round(s)+'s';
  if(s < 3600) return Math.floor(s/60)+'m '+Math.round(s%60)+'s';
  return Math.floor(s/3600)+'h '+Math.floor((s%3600)/60)+'m';
}
async function api(method, path, body){
  const r = await fetch(path, {method, headers:body?{'Content-Type':'application/json'}:undefined, body:body?JSON.stringify(body):undefined});
  const text = await r.text();
  let data; try{ data = JSON.parse(text); } catch(e){ data = null; }
  if(!r.ok){
    throw new Error(data && data.error ? data.error : `${method} ${path} ${r.status}: ${text}`);
  }
  return data;
}

// Loaded models + library ---------------------------------------------------

async function refresh(){
  try{
    const s = await api('GET', '/api/state');

    // Loaded models. Unload takes the instance identifier, which differs from
    // the model key whenever the model was loaded with --identifier.
    if(!s.loaded.length){ el('loaded').replaceChildren(ce('div',{cls:'empty',text:'no models loaded'})); }
    else {
      const t = ce('table');
      t.appendChild(ce('tr',{},['identifier','model','ctx / max','par','ttl','status',''].map(h=>ce('th',{text:h}))));
      for(const m of s.loaded){
        const btn = ce('button', {cls:'danger', text:'Unload'});
        btn.onclick = async () => {
          btn.disabled=true;
          try{ await api('POST','/api/control/unload',{identifier:m.identifier}); }
          catch(e){ alert(e.message); btn.disabled=false; }
          refresh();
        };
        const ctx = m.context ? `${(m.context/1024).toFixed(0)}K / ${(m.max_context/1024).toFixed(0)}K` : '—';
        const cells = [m.identifier, m.model_key, ctx, m.parallel ?? '—',
                       m.ttl_s == null ? 'none' : fmtSecs(m.ttl_s), m.status || '—', ''];
        const row = ce('tr',{},cells.map(c=>ce('td',{text:c==null?'—':String(c)})));
        row.lastChild.replaceChildren(btn);
        t.appendChild(row);
      }
      el('loaded').replaceChildren(t);
    }

    // Local models
    const t = ce('table');
    t.appendChild(ce('tr',{},['model','arch','params','quant','size','max ctx',''].map(h=>ce('th',{text:h}))));
    const sel = el('test-model'), lsel = el('load-model');
    const cur = sel.value, lcur = lsel.value;
    sel.replaceChildren(); lsel.replaceChildren();
    for(const m of s.library){
      const actions = ce('td');
      const del = ce('button',{cls:'danger',text:'Delete'});
      del.onclick = () => confirmDelete(actions, del, m);
      const test = ce('button',{text:'Test'});
      test.onclick = () => { sel.value = m.model_key; el('test-scenario').value='baseline'; el('run-test').click(); };
      actions.replaceChildren(del, ce('span',{text:' '}), test);
      const row = ce('tr',{},[
        ce('td',{text:m.model_key}),
        ce('td',{text:m.arch||'—'}),
        ce('td',{text:m.params||'—'}),
        ce('td',{text:m.quant||'—'}),
        ce('td',{text:fmtBytes(m.size)}),
        ce('td',{text:m.max_context ? (m.max_context/1024).toFixed(0)+'K' : '—'}),
        actions,
      ]);
      if(m.loaded) row.firstChild.appendChild(ce('span',{cls:'pill good',text:'loaded',style:'margin-left:6px'}));
      t.appendChild(row);
      sel.appendChild(ce('option',{text:m.model_key,attrs:{value:m.model_key}}));
      lsel.appendChild(ce('option',{text:m.model_key,attrs:{value:m.model_key}}));
    }
    el('library').replaceChildren(t);
    if(cur && Array.from(sel.options).some(o=>o.value===cur)) sel.value = cur;
    if(lcur && Array.from(lsel.options).some(o=>o.value===lcur)) lsel.value = lcur;

    // Settings (whitelisted keys only — never a raw dump)
    const cfg = s.settings || {};
    if(cfg.error){ el('config').replaceChildren(ce('div',{cls:'empty',text:'settings: '+cfg.error})); }
    else {
      const ct = ce('table');
      ct.appendChild(ce('tr',{},['key','value'].map(h=>ce('th',{text:h}))));
      const show = (k, v) => ct.appendChild(ce('tr',{},[
        ce('td',{text:k}), ce('td',{text:v==null?'—':String(v),style:'color:#a78bfa'})]));
      show('models folder', cfg.downloadsFolder);
      const dcl = cfg.defaultContextLength;
      show('default context', dcl && typeof dcl === 'object' ? dcl.value : dcl);
      const g = cfg.modelLoadingGuardrails;
      show('load guardrails', g && typeof g === 'object' ? g.mode : g);
      show('local service', cfg.enableLocalService);
      show('hf proxy', cfg.useHFProxy);
      el('config').replaceChildren(ct, ce('div',{cls:'meta',text:cfg.path}));
    }
  } catch(e){ console.error(e); }
}

// Deleting removes files from disk with no undo, so the model key must be
// typed back verbatim; the confirm button stays disabled until it matches.
function confirmDelete(cell, delBtn, m){
  const input = ce('input',{attrs:{placeholder:'type '+m.model_key}, style:'font-size:11px;width:220px'});
  const ok = ce('button',{cls:'danger',text:'Confirm delete'});
  ok.disabled = true;
  const cancel = ce('button',{text:'Cancel'});
  input.oninput = () => { ok.disabled = input.value !== m.model_key; };
  cancel.onclick = () => { cell.replaceChildren(delBtn, ce('span',{text:' '}), ce('button',{text:'Test'})); refresh(); };
  ok.onclick = async () => {
    ok.disabled = true; ok.textContent = 'deleting…';
    try{
      const res = await api('DELETE','/api/control/model',{name:m.model_key, confirm:input.value});
      alert('Removed:\n' + (res.removed||[]).join('\n'));
      refresh();
    } catch(e){ alert('Delete failed: '+e.message); ok.textContent = 'Confirm delete'; ok.disabled = false; }
  };
  cell.replaceChildren(input, ce('span',{text:' '}), ok, ce('span',{text:' '}), cancel);
  input.focus();
}

el('unload-all').onclick = async () => {
  if(!confirm('Unload all loaded models?')) return;
  try{ await api('POST','/api/control/unload',{all:true}); refresh(); }
  catch(e){ alert(e.message); }
};

// Jobs (loads and downloads) ------------------------------------------------

function fmtRate(bps){
  if(!bps || bps < 1) return '—';
  if(bps < 1024) return bps.toFixed(0)+' B/s';
  if(bps < 1024*1024) return (bps/1024).toFixed(0)+' KB/s';
  return (bps/(1024*1024)).toFixed(1)+' MB/s';
}
async function refreshJobs(){
  try{
    const jobs = await api('GET','/api/control/jobs');
    const wrap = el('jobs-view');
    const entries = Object.entries(jobs).sort((a,b) => (b[1].started||0) - (a[1].started||0));

    let active = 0, done = 0, errored = 0;
    for(const [,p] of entries){
      if(p.error) errored++; else if(p.done) done++; else active++;
    }
    el('jobs-summary').textContent = entries.length
      ? `${active} active · ${done} done · ${errored} errors` : '— no jobs';

    if(!entries.length){
      wrap.replaceChildren(ce('div',{cls:'empty',text:'no jobs — start a load or download below'}));
      return;
    }
    wrap.replaceChildren();
    for(const [name, p] of entries){
      const border = p.error ? '#5c2828' : p.done ? '#1f4a2f' : '#3d3a18';
      const bg = p.error ? 'rgba(252,165,165,.05)' : p.done ? 'rgba(134,239,172,.05)' : 'rgba(252,211,77,.05)';
      const card = ce('div', {style:`border:1px solid ${border};border-radius:6px;padding:10px;margin-bottom:8px;background:${bg}`});
      const pill = p.error ? ce('span',{cls:'pill bad',text:'error'})
                 : p.done  ? ce('span',{cls:'pill good',text:'done'})
                           : ce('span',{cls:'pill warn',text:p.kind === 'load' ? 'loading' : 'downloading'});
      card.appendChild(ce('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px'},[
        ce('span',{text:name,style:'color:var(--accent2);font-weight:600;font-size:13px'}),
        ce('span',{},[ce('span',{cls:'pill dim',text:p.kind,style:'margin-right:6px'}), pill]),
      ]));
      card.appendChild(ce('div',{text:p.error || p.last_line || p.status || '—',
                                style:'font-size:11px;color:var(--dim);margin-bottom:6px;word-break:break-word'}));

      // `lms get` progress may be indeterminate; show a bar only when we have
      // a real percentage or byte pair, otherwise the last line above stands in.
      const pct = p.total ? (p.completed/p.total*100) : (p.pct != null ? p.pct : null);
      if(pct != null && !p.done){
        card.appendChild(ce('div',{cls:'bar',style:'margin:6px 0'},[ce('div',{style:`width:${pct}%`})]));
        const bits = [
          ce('span',{},[ce('span',{text:'progress ',style:'color:var(--dim)'}), ce('span',{text:pct.toFixed(1)+'%',style:'color:var(--text)'})]),
        ];
        if(p.total) bits.push(ce('span',{},[ce('span',{text:'transferred ',style:'color:var(--dim)'}),
          ce('span',{text:`${fmtBytes(p.completed)} / ${fmtBytes(p.total)}`,style:'color:var(--text)'})]));
        if(p.rate_bps) bits.push(ce('span',{},[ce('span',{text:'rate ',style:'color:var(--dim)'}),
          ce('span',{text:fmtRate(p.rate_bps),style:'color:var(--accent)'})]));
        if(p.eta) bits.push(ce('span',{},[ce('span',{text:'eta ',style:'color:var(--dim)'}),
          ce('span',{text:p.eta,style:'color:var(--text)'})]));
        card.appendChild(ce('div',{style:'display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums'}, bits));
      }
      wrap.appendChild(card);
    }
  } catch(e){}
}
el('jobs-clear').onclick = async () => {
  try{ await api('POST','/api/control/jobs/clear',{}); refreshJobs(); } catch(e){ alert(e.message); }
};

// Load ----------------------------------------------------------------------

function loadOpts(){
  const v = id => { const s = el(id).value.trim(); return s === '' ? null : s; };
  return {model: el('load-model').value, context: v('load-ctx'), gpu: v('load-gpu'),
          ttl: v('load-ttl'), parallel: v('load-par'), identifier: v('load-id')};
}
el('estimate-btn').onclick = async () => {
  const out = el('estimate-out');
  out.replaceChildren(ce('div',{cls:'empty',text:'estimating…'}));
  try{
    const r = await api('POST','/api/control/load/estimate', loadOpts());
    out.replaceChildren(r.ok ? ce('pre',{cls:'content',text:r.output})
                             : ce('div',{cls:'empty',text:'error: '+r.error}));
  } catch(e){ out.replaceChildren(ce('div',{cls:'empty',text:'error: '+e.message})); }
};
el('load-btn').onclick = async () => {
  try{
    const r = await api('POST','/api/control/load', loadOpts());
    if(!r.started) alert('A job for this model is already running.');
    refreshJobs();
  } catch(e){ alert(e.message); }
};

// Catalog -------------------------------------------------------------------

let CAT_DATA = [];
function renderCatalog(){
  const q = (el('cat-search').value || '').toLowerCase().trim();
  const items = CAT_DATA.filter(m => {
    if(!q) return true;
    const hay = (m.name + ' ' + m.slug + ' ' + m.sizes.join(' ')).toLowerCase();
    return q.split(/\s+/).every(t => hay.includes(t));
  });
  const wrap = el('catalog');
  if(!items.length){ wrap.replaceChildren(ce('div',{cls:'empty',text:'no matches'})); return; }
  wrap.replaceChildren();
  for(const m of items){
    const card = ce('div', {style:'border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;align-items:center'});
    const left = ce('div',{style:'flex:1;min-width:0'});
    left.appendChild(ce('div',{text:m.name,style:'color:var(--accent2);font-weight:600;font-size:13px'}));
    left.appendChild(ce('div',{text:m.slug,style:'color:var(--dim);font-size:11px'}));
    const tags = ce('div',{style:'display:flex;flex-wrap:wrap;gap:4px;margin-top:6px'});
    for(const s of m.sizes) tags.appendChild(ce('span',{cls:'pill dim',text:s}));
    left.appendChild(tags);
    const b = ce('button',{text:'use',style:'font-size:10px'});
    b.onclick = () => { el('dl-name').value = m.slug; el('dl-name').scrollIntoView({block:'center'}); el('dl-name').focus(); };
    card.appendChild(left); card.appendChild(b);
    wrap.appendChild(card);
  }
}
async function refreshCatalog(force=false){
  try{
    const r = await api('GET', '/api/control/catalog' + (force?'?refresh=1':''));
    CAT_DATA = r.data || [];
    el('cat-age').textContent = r.cached_age_s != null
      ? (r.cached_age_s === 0 ? 'fresh' : `${Math.round(r.cached_age_s/60)}m old`) : '—';
    renderCatalog();
  } catch(e){
    el('catalog').replaceChildren(ce('div',{cls:'empty',text:'error: '+e.message}));
  }
}
el('cat-search').oninput = renderCatalog;
el('cat-refresh').onclick = () => refreshCatalog(true);
refreshCatalog();

// Download ------------------------------------------------------------------

el('dl-btn').onclick = async () => {
  const name = el('dl-name').value.trim();
  if(!name) return;
  try{
    const r = await api('POST','/api/control/download',{name});
    if(!r.started) alert('A job for this name is already running.');
    el('dl-name').value = '';
    refreshJobs();
  } catch(e){ alert(e.message); }
};

// Scenarios -----------------------------------------------------------------

const ssel = el('test-scenario');
for(const [k,label] of Object.entries(SCENARIOS)){
  ssel.appendChild(ce('option',{text:label,attrs:{value:k}}));
}
ssel.onchange = () => { el('test-custom').style.display = ssel.value === 'custom' ? 'block' : 'none'; };

function stat(k,v){ return ce('span',{cls:'stat'},[ce('div',{cls:'k',text:k}), ce('div',{cls:'v',text:v==null?'—':String(v)})]); }

el('run-test').onclick = async () => {
  const model = el('test-model').value, scenario = el('test-scenario').value;
  const custom = el('test-custom').value;
  const out = el('test-result');
  out.replaceChildren(ce('div',{cls:'empty',text:`running ${scenario} on ${model}…`}));
  el('run-test').disabled = true;
  try{
    const r = await api('POST','/api/control/test',{model, scenario, custom_prompt:custom});
    if(!r.ok){ out.replaceChildren(ce('div',{cls:'empty',text:'error: '+r.error})); return; }
    const st = r.stats || {}, mi = r.model_info || {}, rt = r.runtime || {};
    const tps = st.tokens_per_second != null ? st.tokens_per_second.toFixed(1)+' tok/s' : '—';
    const items = [ce('div',{},[
      stat('model', r.model),
      stat('scenario', r.scenario),
      stat('throughput', tps),
      // time-to-first-token comes straight from LM Studio's stats block
      stat('ttft', st.ttft_s != null ? (st.ttft_s*1000).toFixed(0)+' ms' : '—'),
      stat('generated', `${st.completion_tokens} tok` + (st.reasoning_tokens ? ` (${st.reasoning_tokens} reasoning)` : '')),
      stat('prompt', `${st.prompt_tokens} tok`),
      stat('gen time', st.generation_s != null ? st.generation_s.toFixed(2)+'s' : '—'),
      stat('wall', st.wall_seconds + 's'),
      stat('stop', st.stop_reason),
    ])];
    if(mi.arch || rt.name){
      items.push(ce('div',{cls:'meta',text:
        `${mi.arch||'—'} · ${mi.quant||'—'} · ctx ${mi.context_length||'—'} · ${rt.name||''} ${rt.version||''}`.trim()}));
    }
    if(r.thinking) items.push(ce('div',{cls:'meta',text:'thinking',style:'margin-top:8px'}), ce('pre',{cls:'thinking',text:r.thinking}));
    if(r.content)  items.push(ce('div',{cls:'meta',text:'content', style:'margin-top:8px'}), ce('pre',{cls:'content',text:r.content}));
    if(r.tool_calls && r.tool_calls.length){
      items.push(ce('div',{cls:'meta',text:'tool calls', style:'margin-top:8px'}));
      items.push(ce('pre',{cls:'content',text:JSON.stringify(r.tool_calls,null,2)}));
    }
    out.replaceChildren(...items);
  } catch(e){ out.replaceChildren(ce('div',{cls:'empty',text:'error: '+e.message})); }
  finally{ el('run-test').disabled = false; }
};

refresh(); setInterval(refresh, 3000);
refreshJobs(); setInterval(refreshJobs, 1000);
</script>
